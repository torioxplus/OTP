<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="simGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="12" y1="16" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- SIM Card Body with Cutout Corner -->
  <path
    d="M10 6C7.79086 6 6 7.79086 6 10V38C6 40.2091 7.79086 42 10 42H38C40.2091 42 42 40.2091 42 38V16L32 6H10Z"
    fill="url(#simGrad)"
    filter="url(#glow)"
  />

  <!-- Subtle Inner Border -->
  <path
    d="M10 7.5C8.61929 7.5 7.5 8.61929 7.5 10V38C7.5 39.3807 8.61929 40.5 10 40.5H38C39.3807 40.5 40.5 39.3807 40.5 38V16.6213L31.3787 7.5H10Z"
    stroke="white"
    stroke-opacity="0.25"
    stroke-width="1.5"
  />

  <!-- Royal Blue Microchip Core -->
  <rect x="14" y="17" width="18" height="18" rx="3.5" fill="url(#chipGrad)" />
  <rect x="14" y="17" width="18" height="18" rx="3.5" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />

  <!-- Microchip Circuit Lines -->
  <path d="M14 23H20M14 29H20M32 23H26M32 29H26M23 17V20M23 32V35M20 23V29H26V23H20Z" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pulse / Signal Waves in Top Left Corner -->
  <circle cx="36" cy="11" r="1.5" fill="#93c5fd" />
  <path d="M33 8.5C34.5 7 37 7 38.5 8.5" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" />
</svg>
